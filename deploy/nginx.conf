resolver 127.0.0.11 valid=10s ipv6=off;

map $http_authorization $anon_key {
    ""      $binary_remote_addr; # Missing header -> $anon_key=IP Address
    default "";                  # Present header -> $anon_key="" (disabled)
}

map $http_authorization $auth_key {
    ""      "";                   # Missing header -> $auth_key="" (disabled)
    default $http_authorization;  # Present header -> $auth_key=$http_authorization
}

# WebSocket/upgrade passthrough: only send "Connection: upgrade" for actual
# upgrade requests; empty (keepalive-friendly) for normal HTTP/SSE requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Anon requests limited to 10/s and keyed by IP address:
limit_req_zone $anon_key zone=anon:10m rate=10r/s;

# Requests w/ token limited to 40/s and keyed by token:
limit_req_zone $auth_key zone=auth:10m rate=40r/s;

limit_req_status 429;

# Reuse connections to the gateway. Without an upstream keepalive pool nginx
# opens a TCP connection per request and, under load, runs out of local ports
# ("connect() ... (99: Cannot assign requested address)" -> 502).
# `resolve` re-resolves the compose service name like the old variable did.
upstream inference_gateway {
    zone inference_gateway 64k;
    server inference-gateway:7000 resolve;
    keepalive 128;
    # Below the gateway's own keep-alive (gunicorn --keep-alive 75), so nginx
    # never reuses a connection the gateway is closing.
    keepalive_timeout 60s;
}

server {
    listen 8000;
    server_name localhost;
    client_max_body_size 16m;

    # No admin routes here: the admin API and the admin console are served only
    # by controller-manager on 127.0.0.1:9100, which nginx never proxies to.

    location / {
        limit_req zone=anon burst=20;
        limit_req zone=auth burst=80;

        proxy_pass http://inference_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lets the gateway report time queued before it (Server-Timing "queue")
        proxy_set_header X-Request-Start "t=$msec";
        proxy_redirect off;

        # buffering holds SSE chunks until buffers fill, ruining TTFT/ITL
        proxy_buffering off;
        gzip off;                       # never compress SSE

        # Increase timeouts for potentially long-running requests (adjust as needed)
        proxy_connect_timeout 600s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        send_timeout 900s;
    }
}
