# Dev overlay: layer on top of compose.yaml.
#   COMPOSE_FILE=deploy/compose.yaml:deploy/compose.dev.yaml
#
# Adds the local nginx front-end, auto-running migrations, dev data volumes, and
# the dev-specific env (.env.compose: dev DB URL and service URLs). Secrets come
# from the per-service files named in compose.yaml, as in prod.

services:
  nginx:
    image: nginx:latest@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - inference-gateway
    networks:
      - gateway
    restart: unless-stopped

  inference-gateway:
    env_file: &dev-env
      - path: ../.env.compose # dev DB name / credentials / service URLs
        required: true
    volumes:
      - prompt-records-dev:/app/prompt-records

  controller-manager:
    env_file: *dev-env

  postgres:
    environment:
      POSTGRES_DB: first_gateway_dev
      POSTGRES_USER: first_gateway
      POSTGRES_PASSWORD: password # dev only; FIRST_DB_URL in .env.compose matches
    volumes:
      - postgres-dev:/var/lib/postgresql

  redis:
    volumes:
      - redis-dev:/data

  prometheus:
    group_add:
      - "900"
    volumes:
      - prometheus-dev:/prometheus

  grafana:
    volumes:
      - grafana-dev:/var/lib/grafana

  vector:
    volumes:
      - vector-dev:/var/lib/vector

  prompt-shipper:
    volumes:
      - prompt-records-dev:/data

  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Alembic needs only FIRST_DB_URL (dev credentials, in .env.compose).
    env_file: *dev-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: .venv/bin/alembic -c packages/gateway/first_gateway/database/alembic.ini upgrade head
    networks:
      - gateway

volumes:
  postgres-dev:
  redis-dev:
  prometheus-dev:
  grafana-dev:
  prompt-records-dev:
  vector-dev:
