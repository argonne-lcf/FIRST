upstream app_server {
    # The internal hostname and port of the Gunicorn/Django service
    server inference-gateway:7000;
}

map $http_authorization $anon_key {
    ""      $binary_remote_addr; # Missing header -> $anon_key=IP Address
    default "";                  # Present header -> $anon_key="" (disabled)
}

map $http_authorization $auth_key {
    ""      "";                   # Missing header -> $auth_key="" (disabled)
    default $http_authorization;  # Present header -> $auth_key=$http_authorization
}

# WebSocket/upgrade passthrough: only send "Connection: upgrade" for actual
# upgrade requests; empty (keepalive-friendly) for normal HTTP/SSE requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Anon requests limited to 10/s and keyed by IP address:
limit_req_zone $anon_key zone=anon:10m rate=10r/s;

# Requests w/ token limited to 40/s and keyed by token:
limit_req_zone $auth_key zone=auth:10m rate=40r/s;

limit_req_status 429;

server {
    listen 8000;
    server_name localhost;

    location = /admin-console {
        return 301 /admin-console/;
    }

    # Content-hashed build assets: cache hard.
    location /admin-console/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else under the console: serve the file if it exists,
    # otherwise fall back to index.html so deep links and the OAuth
    # landing at /admin-console/callback?code=... work on hard loads.
    location /admin-console/ {
        allow 127.0.0.1;
        deny all;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        try_files $uri /admin-console/index.html;
    }

    location / {
        limit_req zone=anon burst=20;
        limit_req zone=auth burst=80;

        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # buffering holds SSE chunks until buffers fill, ruining TTFT/ITL
        proxy_buffering off;
        gzip off;                       # never compress SSE

        # Increase timeouts for potentially long-running requests (adjust as needed)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
