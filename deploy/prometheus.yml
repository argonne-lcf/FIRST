global:
  scrape_interval: 15s

scrape_configs:
  - job_name: controller-manager
    static_configs:
      - targets: ["controller-manager:9100"]

  # One job per pilot cluster: each cluster's pilots carry their own TLS server
  # name (first_common.schema.pilot.pilot_server_name), and Prometheus applies
  # a single server_name per job. A new pilot cluster needs its own job here.
  - job_name: pilot-tara
    proxy_from_environment: true
    http_sd_configs:
      - url: http://controller-manager:9100/discovery/v1/prometheus?pilot_cluster=tara
        refresh_interval: 1m
        proxy_from_environment: true
    tls_config:
      # Compose secrets: the CA and the first-metrics client identity.
      ca_file: /run/secrets/pilot_ca.crt
      cert_file: /run/secrets/pilot_client.crt
      key_file: /run/secrets/pilot_client.key
      server_name: tara.first-pilot.internal

  - job_name: pilot-sophia
    proxy_from_environment: true
    http_sd_configs:
      - url: http://controller-manager:9100/discovery/v1/prometheus?pilot_cluster=sophia
        refresh_interval: 1m
        proxy_from_environment: true
    tls_config:
      ca_file: /run/secrets/pilot_ca.crt
      cert_file: /run/secrets/pilot_client.crt
      key_file: /run/secrets/pilot_client.key
      server_name: sophia.first-pilot.internal

  # Static backends without mTLS (the discovery endpoint with no parameters).
  - job_name: static-backends
    proxy_from_environment: true
    http_sd_configs:
      - url: http://controller-manager:9100/discovery/v1/prometheus
        refresh_interval: 1m
        proxy_from_environment: true

  # One job per StaticDeployment mTLS certificate set (pki/upstream/<set>/):
  # Prometheus applies a single tls_config per job, and the discovery endpoint
  # lists only the backends presenting `mtls_cert_file`.
  #
  # - job_name: upstream-mtls-<set>
  #   proxy_from_environment: true
  #   http_sd_configs:
  #     - url: http://controller-manager:9100/discovery/v1/prometheus?mtls_cert_file=/run/secrets/upstream/<set>/client.crt
  #       refresh_interval: 1m
  #       proxy_from_environment: true
  #   tls_config:
  #     ca_file: /run/secrets/upstream/<set>/ca.crt
  #     cert_file: /run/secrets/upstream/<set>/client.crt
  #     key_file: /run/secrets/upstream/<set>/client.key

  # Direct per-instance Minerva discovery; do not scrape its logical deployments.
  # Discovery and target scrapes each need their own verified mTLS identity.
  - job_name: minerva-vllm
    scheme: https
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: false
    follow_redirects: false
    http_sd_configs:
      - url: https://minerva-login-01.minerva.alcf.anl.gov:9443/discovery/v1/prometheus
        refresh_interval: 15s
        follow_redirects: false
        tls_config:
          ca_file: /run/secrets/upstream/minerva/ca.crt
          cert_file: /run/secrets/upstream/minerva/client.crt
          key_file: /run/secrets/upstream/minerva/client.key
          server_name: minerva-login-01.minerva.alcf.anl.gov
          insecure_skip_verify: false
          min_version: TLS13
    tls_config:
      ca_file: /run/secrets/upstream/minerva/ca.crt
      cert_file: /run/secrets/upstream/minerva/client.crt
      key_file: /run/secrets/upstream/minerva/client.key
      server_name: minerva-login-01.minerva.alcf.anl.gov
      insecure_skip_verify: false
      min_version: TLS13