# Prod overlay: layer on top of compose.yaml.
#   COMPOSE_FILE=deploy/compose.yaml:deploy/compose.prod.yaml
#
# Differences from dev:
#   - No nginx (the host runs nginx and proxy_passes to 127.0.0.1:7000).
#   - No auto migration (run `make prod-migrate` manually after deploy).
#   - No tunnel (prod egress goes through the host conduit).
#   - Data volumes are `external` so `docker compose down -v` cannot delete them.
#     Create them once with `make prod-init`.
#   - Prod env (.env.prod, non-secret) + per-service secrets on the host:
#     .env.secret.gateway, .env.secret.controller, .env.secret.postgres
#     (docs/deployment/docker.md, "Environment files").

services:
  inference-gateway:
    env_file: &prod-env
      - path: ../.env.prod
        required: true
    # Publish only on loopback; host nginx proxy_passes here.
    ports:
      - "127.0.0.1:7001:7000"
    volumes:
      - prompt_records_prod:/app/prompt-records

  controller-manager:
    env_file: *prod-env

  postgres:
    environment:
      POSTGRES_DB: first_gateway
      POSTGRES_USER: first_gateway
    env_file:
      - path: ../.env.secret.postgres # POSTGRES_PASSWORD only; see .env.postgres.example
        required: true
    volumes:
      - postgres_data_prod:/var/lib/postgresql

  redis:
    volumes:
      - redis_data_prod:/data

  prometheus:
    group_add:
      - "900"
    volumes:
      - prometheus_data_prod:/prometheus

  grafana:
    volumes:
      - grafana_data_prod:/var/lib/grafana

  vector:
    volumes:
      - vector_data_prod:/var/lib/vector

  prompt-shipper:
    volumes:
      - type: volume
        source: prompt_records_prod
        target: /data
        volume:
          nocopy: true

volumes:
  postgres_data_prod:
    external: true
  redis_data_prod:
    external: true
  prometheus_data_prod:
    external: true
  grafana_data_prod:
    external: true
  prompt_records_prod:
    external: true
  # Vector's read positions and unsent buffers.
  vector_data_prod:
    external: true
