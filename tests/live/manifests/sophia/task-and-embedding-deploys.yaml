kind: PilotDeployment
name: sophia/Salesforce/SFR-Embedding-Mistral
spec:
  cluster_name: sophia
  model_name: Salesforce/SFR-Embedding-Mistral
  router_params:
    max_backend_concurrency: 20
  prometheus_metrics_path: "/metrics"

  min_replicas: 0
  max_replicas: 1
  scaling_strategy: null

  max_consecutive_launch_failures: 2
  launch_template_name: sophia/vllm
  launch_spec:
    served_model_name: Salesforce/SFR-Embedding-Mistral
    gpus_per_node: 1
    num_nodes: 1
