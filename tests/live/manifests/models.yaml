kind: Model
name: openai/gpt-oss-20b
spec:
  access_group_name: public
  # Must match the production value: Tara's pinned vLLM recipe refuses to
  # start a replica whose context differs ("model/context differs from recipe").
  max_model_len: 65536
  usage_limits:
    default:  # livetest: fleet role; only backend capacity binds
      tpm: 0
      burst_tokens: 65536   # = max_model_len (unused while tpm is 0)
      rpm: 0
      max_user_concurrency: 64
  overload:  # livetest
    short_retry_sec: 10
    retry_jitter_percent: 30
  demand_signal:  # livetest: fast-reacting demand for the autoscaling walk
    reject_window_sec: 60
    avg_request_duration_sec: 20
    ewma_alpha: 0.5
  supported_endpoints:
    - chat/completions
    - messages
    - responses
  capabilities:
    input_modalities: [text]
    streaming: true
    reasoning:
      supported: true
      effort_levels: [low, medium, high]
      default_effort: medium
      separate_output: true
    tool_calling:
      supported: true

