[package]
name = "first-slogs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
backhand = "0.25.1"
blake3 = "1.8.7"
clap = { version = "4.6.2", features = ["derive"] }
libc = "0.2.189"
memchr = "2.8.3"
memmap2 = "0.9.11"
polars = { version = "0.54.4", features = ["json", "lazy", "parquet", "streaming", "strings"] }
rayon = "1"
regex = "1.13.1"
sonic-rs = { version = "0.5.8", features = ["sort_keys"] }
