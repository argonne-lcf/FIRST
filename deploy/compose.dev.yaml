# Dev overlay: layer on top of compose.yaml.
#   COMPOSE_FILE=deploy/compose.yaml:deploy/compose.dev.yaml
#
# Adds the local nginx front-end, auto-running migrations, dev data volumes, and
# the dev-specific env (.env.compose: dev DB name, credentials, service URLs).

services:
  nginx:
    image: nginx:latest@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../packages/admin-console/dist:/usr/share/nginx/html/admin-console:ro
    depends_on:
      - inference-gateway
    networks:
      - gateway
    restart: unless-stopped

  inference-gateway:
    env_file: &dev-env
      - path: ../.env.compose # dev DB name / credentials / service URLs
        required: true

  controller-manager:
    env_file: *dev-env

  postgres:
    env_file: *dev-env
    volumes:
      - postgres-dev:/var/lib/postgresql

  redis:
    volumes:
      - redis-dev:/data

  prometheus:
    volumes:
      - prometheus-dev:/prometheus

  grafana:
    volumes:
      - grafana-dev:/var/lib/grafana

  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env.default
        required: true
      - path: ../.env.secret
        required: true
      - path: ../.env.compose
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: .venv/bin/alembic -c packages/gateway/first_gateway/database/alembic.ini upgrade head
    networks:
      - gateway

volumes:
  postgres-dev:
  redis-dev:
  prometheus-dev:
  grafana-dev:
