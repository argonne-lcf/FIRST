# Base stack: services common to BOTH dev and prod.
#
# This file is never used alone. Layer an environment overlay on top:
#   dev  : deploy/compose.yaml:deploy/compose.dev.yaml
#   prod : deploy/compose.yaml:deploy/compose.prod.yaml
# Optionally append deploy/compose.tunnel.yaml (dev only) for the SOCKS tunnel.

services:
  inference-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: &base-env
      - path: ../.env.default # common, non-secret
        required: true
      - path: ../.env.secret  # .gitignored secrets
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gateway
    restart: unless-stopped
    logging: &logging
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  controller-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: *base-env
    command: [".venv/bin/python", "-m", "first_gateway.controllers.manager"]
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c \"import urllib.request; assert urllib.request.urlopen('http://localhost:9100/healthz').status == 200\"" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *logging

  postgres:
    image: postgres:18@sha256:7157393f508fd8eb46119937fab39813783fe3e7d4c6316c45c12ce2ea25e61d
    env_file: *base-env
    networks:
      - gateway
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    # Tuned for latency/throughput under concurrency. Data is persistent but
    # non-critical (no backups): light RDB only, no AOF.
    command:
      - redis-server
      - --port
      - "6380"
      - --appendonly
      - "no"
      - --save
      - "900 1"
      - --io-threads
      - "2"
      - --tcp-backlog
      - "511"
      - --maxmemory-policy
      - noeviction
      - --latency-monitor-threshold
      - "10"
      - --slowlog-log-slower-than
      - "10000"
      - --slowlog-max-len
      - "128"
    networks:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://127.0.0.1:6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:6380:6380"
    logging: *logging

  prometheus:
    image: prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    # Finite footprint for a resource-constrained VM: retain ~2 weeks or 5GB,
    # whichever comes first. Admin API enabled so scripts/prom-snapshot.sh can
    # take offline snapshots.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-admin-api
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - gateway
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../pki/ca.crt:/etc/prometheus/certs/ca.crt:ro
      - ../pki/client.first-pilot.internal.crt:/etc/prometheus/certs/client.crt:ro
      - ../pki/client.first-pilot.internal.key:/etc/prometheus/certs/client.key:ro
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:latest@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    networks:
      - gateway
    restart: unless-stopped
    logging: *logging

networks:
  gateway:
    driver: bridge
