global:
  scrape_interval: 15s

scrape_configs:
  - job_name: controller-manager
    static_configs:
      - targets: ["controller-manager:9100"]

  - job_name: model-backends
    proxy_from_environment: true
    http_sd_configs:
      - url: http://controller-manager:9100/discovery/v1/prometheus
        refresh_interval: 1m
        proxy_from_environment: true
    tls_config:
      # Compose secrets: the CA and the first-metrics client identity.
      ca_file: /run/secrets/pilot_ca.crt
      cert_file: /run/secrets/pilot_client.crt
      key_file: /run/secrets/pilot_client.key
      # PILOT_SERVER_SAN: only the pilot server cert carries this name.
      server_name: first-pilot.internal
