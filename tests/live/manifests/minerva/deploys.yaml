kind: StaticDeployment
name: minerva/beam-1.0-bf16
spec:
  cluster_name: minerva
  model_name: beam-1.0-bf16
  api_url: "https://minerva-login-01.minerva.alcf.anl.gov:9443/models/beam-1.0-bf16"
  api_key: env_var://FIRST_UPSTREAM_KEY_MINERVA_DIRECT
  mtls:
    ca_file: /run/secrets/upstream/minerva/ca.crt
    cert_file: /run/secrets/upstream/minerva/client.crt
    key_file: /run/secrets/upstream/minerva/client.key
  upstream_model_name: beam-1.0-bf16
  router_params:
    weight: 1
    max_backend_concurrency: 10
    cooldown_threshold: 3
    cooldown_window_sec: 30
    cooldown_bench_sec: 60
  health_check:
    url: "https://minerva-login-01.minerva.alcf.anl.gov:9443/models/beam-1.0-bf16/v1/chat/completions"
    api_key: env_var://FIRST_UPSTREAM_KEY_MINERVA_DIRECT
    http_method: POST
    json_body:
      model: beam-1.0-bf16
      messages:
        - {"role":"user","content":"Reply with exactly one word: OK"}
      max_tokens: 5
    status_range: [200, 200]
    match_pattern: "choices"
    attempts_per_check: 1
    attempt_delay: 3.0
    debounce: 3
    read_timeout: 90
  prometheus_metrics_path: null

