# Dev-gateway Analytics listener: select this overlay, after
# compose.analytics.yaml, in .env, then compose-up. Prometheus itself stays on
# loopback (the base) for local snapshots; Analytics Grafana reads through the
# mTLS, read-only prometheus-analytics-proxy. Keep the host firewall
# restricting it to inference-olap-01 as defense in depth.
services:
  prometheus-analytics-proxy:
    ports:
      - "140.221.33.155:9090:9090"
