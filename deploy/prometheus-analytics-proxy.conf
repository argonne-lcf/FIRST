# The only non-loopback way into Prometheus: Analytics Grafana's read-only view
# (deploy/compose.analytics.yaml). Prometheus itself publishes on loopback only.
#
# - mTLS: the client must present a certificate from the analytics CA
#   (pki/analytics-ca.crt) with CN=first-analytics-grafana.
# - Read-only: GET/POST to the query API Grafana's Prometheus datasource uses.
#   Everything else is 403: the admin API (delete_series, snapshot), /-/reload,
#   /federate, and the config/targets status pages that map internal hosts.
# - Upstream: verified HTTPS to prometheus:9090 against the gateway CA.
#
# Runs as nginx's unprivileged user with a read-only root: every writable path
# is under /tmp (a tmpfs).

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format analytics '$remote_addr "$ssl_client_s_dn" [$time_local] '
                         '"$request_method $uri" $status $body_bytes_sent '
                         '$request_time';
    access_log /dev/stdout analytics;

    # Accept exactly the Grafana identity, not any certificate the analytics
    # CA has signed (it also signs the Grafana and ClickHouse server certs).
    map $ssl_client_s_dn $analytics_client_ok {
        default 0;
        "~(^|,)CN=first-analytics-grafana(,|$)" 1;
    }

    # A dashboard load fires many panel queries at once.
    limit_req_zone $ssl_client_s_dn zone=analytics:1m rate=20r/s;
    limit_req_status 429;

    upstream prometheus {
        server prometheus:9090;
        keepalive 8;
    }

    server {
        listen 9090 ssl;
        http2 on;

        ssl_certificate     /run/secrets/prometheus_server.crt;
        ssl_certificate_key /run/secrets/prometheus_server.key;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:analytics_tls:1m;

        ssl_client_certificate /run/secrets/analytics_ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;

        client_max_body_size 1m;

        if ($analytics_client_ok = 0) {
            return 403;
        }

        location ~ ^/api/v1/(query|query_range|query_exemplars|series|labels|label/[^/]+/values|metadata|status/buildinfo|format_query|parse_query)$ {
            limit_except GET POST {
                deny all;
            }
            limit_req zone=analytics burst=200 nodelay;

            proxy_pass https://prometheus;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host prometheus;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/secrets/pilot_ca.crt;
            proxy_ssl_name prometheus;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_session_reuse on;
            # Above Prometheus's --query.timeout, so Prometheus reports it.
            proxy_read_timeout 150s;
        }

        location = /-/ready {
            limit_except GET {
                deny all;
            }
            proxy_pass https://prometheus;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host prometheus;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/secrets/pilot_ca.crt;
            proxy_ssl_name prometheus;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.3;
        }

        location / {
            return 403;
        }
    }
}
