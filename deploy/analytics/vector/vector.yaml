# Sample Vector configuration for VM1.
#
# Mirrors docs/architecture/structured-logging-clickhouse.md. Values written as
# ${...} are interpolated by Vector from the container environment (see
# compose.yaml).
#
# Only the structured events reach ClickHouse: a line is inserted when it
# parses as JSON and carries an event_id. Everything else (debug lines, the
# `user` auth events) is dropped here and, if the archive is enabled, retained
# in S3 by vector-archive.yaml.

data_dir: /var/lib/vector

api:
  enabled: true
  address: 127.0.0.1:8686

sources:
  inference:
    type: docker_logs
    # Set this to the gateway container's name: `docker compose ps` in the
    # stack's directory shows it (for example `deploy-inference-gateway-1`).
    include_containers:
      - first-inference-gateway

transforms:
  parsed:
    type: remap
    inputs: [inference]
    source: |
      # A non-JSON line (or a JSON non-object) raises here and is dropped.
      parsed = parse_json!(.message)
      . = merge(., parsed)

  events:
    type: filter
    inputs: [parsed]
    condition: "exists(.event_id)"

sinks:
  clickhouse:
    type: clickhouse
    inputs: [events]
    endpoint: https://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTPS_PORT}
    tls:
      ca_file: /etc/vector/certs/ca.crt
      verify_certificate: true
      verify_hostname: true
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USER}
      password: ${CLICKHOUSE_PASSWORD}
    database: analytics
    table: events_raw
    # Unmatched fields are dropped, not fatal: the three events carry different
    # fields and the schema holds the union.
    skip_unknown_fields: true
    # No retry cap: a finite one would drop events, so the disk buffer holds
    # them instead.
    request:
      retry_attempts: unlimited
    buffer:
      type: disk
      max_size: 4294967296  # 4 GiB
      when_full: block
    batch:
      max_bytes: 10485760  # 10 MiB
      timeout_secs: 5
