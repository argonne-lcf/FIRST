# Base stack: services common to BOTH dev and prod.
#
# This file is never used alone. Layer an environment overlay on top:
#   dev  : deploy/compose.yaml:deploy/compose.dev.yaml
#   prod : deploy/compose.yaml:deploy/compose.prod.yaml
# Optionally append deploy/compose.tunnel.yaml (dev only) for the SOCKS tunnel.

services:
  inference-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: &base-env
      - path: ../.env.default # common, non-secret
        required: true
      - path: ../.env.secret  # .gitignored secrets
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - source: pilot_ca
        target: pilot_ca.crt
      - source: router_crt
        target: pilot_client.crt
      - source: router_key
        target: pilot_client.key
    volumes:
      # StaticDeployment mTLS certificate sets (see the note under `secrets:`)
      - ../pki/upstream:/run/secrets/upstream:ro
    networks:
      - gateway
    restart: unless-stopped
    # The gateway's stdout is the structured usage log. Vector ships it from
    # these files (log-shipping/vector/v2.yaml), so they are json-file, and
    # their size is how long shipping may be down before lines are lost:
    # 80 x 500 MB = 40 GB, over two weeks at ~2.5 GB/day (V1 writes 1.8 GB
    # a day; Docker's JSON wrapping adds about a third).
    # `labels` records which container wrote each line.
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "80"
        labels: "com.docker.compose.project,com.docker.compose.service"

  controller-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: *base-env
    command: [".venv/bin/python", "-m", "first_gateway.controllers.manager"]
    ports:
      - "127.0.0.1:9100:9100"
    secrets:
      - source: pilot_ca
        target: pilot_ca.crt
      - source: control_crt
        target: pilot_client.crt
      - source: control_key
        target: pilot_client.key
    volumes:
      - ../pki/upstream:/run/secrets/upstream:ro
      # What the prompt shippers last did, for the health alerter.
      - log-shipping-status:/run/log-shipping:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c \"import urllib.request; assert urllib.request.urlopen('http://localhost:9100/healthz').status == 200\"" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: &logging
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18@sha256:7157393f508fd8eb46119937fab39813783fe3e7d4c6316c45c12ce2ea25e61d
    env_file: *base-env
    networks:
      - gateway
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    # Tuned for latency/throughput under concurrency. Data is persistent but
    # non-critical (no backups): light RDB only, no AOF.
    command:
      - redis-server
      - --port
      - "6380"
      - --appendonly
      - "no"
      - --save
      - "900 1"
      - --io-threads
      - "2"
      - --tcp-backlog
      - "511"
      - --maxmemory-policy
      - noeviction
      - --latency-monitor-threshold
      - "10"
      - --slowlog-log-slower-than
      - "10000"
      - --slowlog-max-len
      - "128"
    networks:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://127.0.0.1:6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:6380:6380"
    logging: *logging

  prometheus:
    image: prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    # Finite footprint for a resource-constrained VM: retain ~2 weeks or 5GB,
    # whichever comes first. Admin API enabled so scripts/prom-snapshot.sh can
    # take offline snapshots.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-admin-api
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - gateway
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../pki/upstream:/run/secrets/upstream:ro
    secrets:
      - source: pilot_ca
        target: pilot_ca.crt
      - source: metrics_crt
        target: pilot_client.crt
      - source: metrics_key
        target: pilot_client.key
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:latest@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    networks:
      - gateway
    restart: unless-stopped
    logging: *logging

  # --- Log shipping (docs/deployment/log-shipping.md) --------------------------
  # Off unless the `log-shipping` profile is on (COMPOSE_PROFILES in .env).
  # The environment overlays add each service's data volume.

  # Structured logs -> S3 and ClickHouse.
  vector:
    image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    profiles: [log-shipping]
    command: ["--config", "/etc/log-shipping/vector/*.yaml"]
    env_file: &log-shipping-env
      - path: ../.env.secret.log-shipping # see .env.log-shipping.example
        required: true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./log-shipping/vector/common.yaml:/etc/log-shipping/vector/common.yaml:ro
      - ./log-shipping/vector/v2.yaml:/etc/log-shipping/vector/v2.yaml:ro
      - ./log-shipping/vector/gateway_logs.vrl:/etc/log-shipping/vector/gateway_logs.vrl:ro
      - ./log-shipping/vector/settings.sh:/etc/log-shipping/vector/settings.sh:ro
      # Private CAs for S3 / ClickHouse, if they need one (*_CA_FILE).
      - ../pki/log-shipping:/etc/log-shipping/pki:ro
      # Docker's json-file logs. Read-only, and root in the container: the
      # files are root's. `docker info -f '{{.DockerRootDir}}'` gives the path.
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
    networks:
      - gateway
    restart: unless-stopped
    cpus: 1.0 # shares the VM with the gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  # Large request/response bodies -> S3, then deleted here.
  prompt-shipper:
    image: rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    profiles: [log-shipping]
    user: "900:900" # `app`, the gateway user that owns the files
    entrypoint: ["/bin/sh", "/ship-prompts.sh"]
    env_file: *log-shipping-env
    environment:
      SHIPPER_NAME: v2
      # The gateway's own tree goes beneath it:
      #   v2/raw/large-requests/YYYY/MM/DD/<request_id>.json
      #   v2/raw/large-responses/YYYY/MM/DD/<request_id>.json
      DEST_PREFIX: v2/raw
      # Hard local limit: a file this old is deleted even if never uploaded.
      MAX_AGE_DAYS: "14"
    volumes:
      - ./log-shipping/ship-prompts.sh:/ship-prompts.sh:ro
      - ../pki/log-shipping:/etc/log-shipping/pki:ro
      - log-shipping-status:/status
    networks:
      - gateway
    restart: unless-stopped
    cpus: 1.0 # shares the VM with the gateway
    logging: *logging

networks:
  gateway:
    driver: bridge

volumes:
  # One small status file per prompt shipper, read by controller-manager.
  # tmpfs so that shippers running as different users can all write to it.
  log-shipping-status:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=1777,size=1m

# Pilot mTLS identities, issued offline by `make pki` (pilot-certmanager).
# Each service mounts the CA plus exactly one client identity, always at
# /run/secrets/pilot_{ca.crt,client.crt,client.key}; the pilot authorizes
# requests by the client cert's CN. No CA key is mounted anywhere.
#
# StaticDeployment mTLS (externally-managed upstreams; unrelated to the pilot
# CA) is a directory mount rather than per-file secrets, so adding a
# certificate set needs no compose change. Place one directory per set:
#   pki/upstream/<set>/{ca.crt,client.crt,client.key}
# It appears at /run/secrets/upstream/<set>/ in inference-gateway,
# controller-manager and prometheus; reference those paths in the spec's
# `mtls` field. Ownership: see docs/deployment/docker.md.
secrets:
  pilot_ca:
    file: ../pki/ca.crt
  control_crt:
    file: ../pki/first-control.crt
  control_key:
    file: ../pki/first-control.key
  router_crt:
    file: ../pki/first-router.crt
  router_key:
    file: ../pki/first-router.key
  metrics_crt:
    file: ../pki/first-metrics.crt
  metrics_key:
    file: ../pki/first-metrics.key
