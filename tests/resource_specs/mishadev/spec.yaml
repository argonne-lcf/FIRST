kind: Cluster
name: sophia
spec:
  health_check:
    url: "https://api.alcf.anl.gov/api/v1/status/resources/9674c7e1-aecc-4dbb-bf01-c9197e027cd6"
    match_pattern: '"current_status":\s*"up"'
    attempts_per_check: 1
  maintenance_notice: null
  pilot_system:
    submit_script_preamble: |
      source /home/openinference_svc/service_account.env
    scheduler_adapter: first_gateway.platforms.schedulers.GlobusComputePBSAdapter
    scheduler_config:
      # /eagle/inference_service/firstv2-pilot/globus_compute/sophia-pbs-adapter
      endpoint_id: 508cbb33-145f-40e4-9f67-1e99660f6a78
    job_walltime_min: 10080
    max_concurrent_jobs: 3
    max_num_nodes: 10
    gpus_per_node: 8
    queue: "infer-svc-test"
    account: inference_service
    scheduler_flags: "-l filesystems=home:eagle"
    workdir: /eagle/inference_service/firstv2-pilot/workdir
    external_port: 8000
    nginx_path: /eagle/inference_service/nginx/sbin/nginx
    ip_allowlist: ["0.0.0.0/0"]
    node_file_env: PBS_NODEFILE
    pilot_path: /eagle/inference_service/env/firstv2-pilot/bin/first-pilot
    job_name_prefix: __FIRST_PILOT_MISHADEV_

---

kind: Cluster
name: metis
spec:
  health_check:
    url: "https://metis.alcf.anl.gov/status"
    match_pattern: '"status":\s*"Live"'
  maintenance_notice: null
  pilot_system: null

---
kind: Cluster
name: tara
spec:
  health_check:
    url: ""
  maintenance_notice: null
  pilot_system:
    submit_script_preamble: ""
    scheduler_adapter: first_gateway.platforms.schedulers.GraphQLPBSAdapter
    scheduler_config:
      keycloak_client_name: tara-pbs
      job_owner: openinference_svc
      graphql_url: https://graphql-bridge-dev-01.lab.alcf.anl.gov/tara/graphql
    job_walltime_min: 10080
    max_concurrent_jobs: 5
    max_num_nodes: 20
    gpus_per_node: 4
    queue: "workq"
    account: inference_service
    scheduler_flags: ""
    workdir: /vast/draco/tara/projects/Tara_Deployment/inference_service/first-pilot/workdir
    external_port: 8000
    nginx_path: /vast/draco/tara/projects/Tara_Deployment/inference_service/first-pilot/nginx/sbin/nginx
    ip_allowlist: ["0.0.0.0/0"]
    node_file_env: PBS_NODEFILE
    pilot_path: /vast/draco/tara/projects/Tara_Deployment/inference_service/first-pilot/FIRST/.venv/bin/first-pilot
    pilot_config_path:  /vast/draco/tara/projects/Tara_Deployment/inference_service/first-pilot/config.yaml
    job_name_prefix: pilot-misha-

---

kind: AccessGroup
name: public
spec:
    allowed_groups: []
    allowed_domains: []

---

kind: Model
name: openai/gpt-oss-120b
spec:
  access_group_name: public
  supported_endpoints:
    - /chat/completions
    - /messages
    - /responses
  aliases:
    - gpt-oss-120b
  usage_limits:
    default:
      tpm: 64000
      burst_tokens: 128000
      rpm: 120
      burst_requests: 10
      max_user_concurrency: 5
    overrides:
      "msalim@anl.gov":
        tpm: 0
        burst_tokens: 0
        rpm: 0
        burst_requests: 0
        max_user_concurrency: 100
  overload:
    short_retry_sec: 10
    retry_jitter_percent: 30
  demand_signal:
    reject_window_sec: 120
    avg_request_duration_sec: 60
    ewma_alpha: 0.4

---

kind: Model
name: openai/gpt-oss-20b
spec:
  access_group_name: public
  supported_endpoints:
    - /chat/completions
    - /messages
    - /responses

---

kind: Model
name: google/gemma-4-31B-it
spec:
  access_group_name: public
  supported_endpoints:
    - /chat/completions
    - /messages
    - /responses

---

kind: StaticDeployment
name: metis/google/gemma-4-31B-it
spec:
  cluster_name: metis
  model_name: google/gemma-4-31B-it
  api_url: "https://metis.alcf.anl.gov/v1"
  api_key: env_var://METIS_API_KEY
  upstream_model_name: gemma-4-31B-it
  router_params:
    weight: 1
    max_backend_concurrency: 10
    cooldown_threshold: 3
    cooldown_window_sec: 30
    cooldown_bench_sec: 60
  health_check:
    url: "https://metis.alcf.anl.gov/v1/chat/completions"
    api_key: env_var://METIS_API_KEY
    http_method: POST
    json_body:
      model: gemma-4-31B-it
      messages:
        - {"role":"user","content":"Reply with exactly one word: OK"}
      max_tokens: 5
    status_range: [200, 200]
    match_pattern: "OK"
    attempts_per_check: 1
    attempt_delay: 3.0
    debounce: 2
  prometheus_metrics_path: null

---

kind: PilotDeployment
name: sophia/openai/gpt-oss-120b
spec:
  cluster_name: sophia
  model_name: openai/gpt-oss-120b
  router_params:
    max_backend_concurrency: 20
  prometheus_metrics_path:  "/metrics"
  prometheus_scrape_interval_sec: 15

  min_replicas: 0
  max_replicas: 2
  scaling_strategy:
    immediate_cold_start: true
    scale_down_sustain_sec: 10800
    scaling_thresholds:
      - [0.0, 1]
      - [5.0, 2]

  max_consecutive_launch_failures: 2
  launch_spec:
    served_model_name: openai/gpt-oss-120b
    gpus_per_node: 4
    num_nodes: 1
    venv_path: /lus/eagle/projects/inference_service/env/vllm-0.19.0
    weights_path: /eagle/inference_service/model_weights/openai/gpt-oss-120b/
    weights_cache_path: /raid/scratch/inference_service/model_weights/openai/gpt-oss-120b/
    max_startup_sec: 600
    health_check:
      url: /health

    env:
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
      VLLM_LOGGING_LEVEL: "INFO"
      USE_FASTSAFETENSOR: "true"
      VLLM_IMAGE_FETCH_TIMEOUT: "60"
      VLLM_USE_RAY_COMPILED_DAG_CHANNEL_TYPE: "shm"
      TORCHINDUCTOR_CACHE_DIR: /raid/scratch/inference_service/model_weights/.cache/torch_inductor
      VLLM_CACHE_ROOT: /raid/scratch/inference_service/model_weights/.cache/vllm
      TRITON_CACHE_DIR: /raid/scratch/inference_service/model_weights/.cache/triton
      VLLM_ATTENTION_BACKEND: TRITON_ATTN
      HTTP_PROXY: "http://proxy.alcf.anl.gov:3128"
      HTTPS_PROXY: "http://proxy.alcf.anl.gov:3128"

    serve_script_template: |
      ulimit -c unlimited

      mkdir -p $TORCHINDUCTOR_CACHE_DIR
      mkdir -p $VLLM_CACHE_ROOT
      mkdir -p $TRITON_CACHE_DIR

      ~/sync_model_weights_on_scratch.sh {{served_model_name}} \
        --source /eagle/inference_service/model_weights \
        --dest /raid/scratch/inference_service/model_weights \
        --ext "safetensors json txt py model jinja yaml"

      source {{venv_path}}/bin/activate
      which python
      export CUDA_VISIBLE_DEVICES={{ gpus_by_host.values() | first | join(',') }}

      vllm serve {{weights_cache_path}} \
        --served-model-name {{served_model_name}} \
        --uds {{uds}} \
        --disable-access-log-for-endpoints /health,/metrics \
        --enable-log-requests \
        --tool-call-parser openai \
        --enable-auto-tool-choice \
        --tensor-parallel-size 4 \
        --max-model-len 65536 \
        --max-num-seqs 32

---

kind: PilotDeployment
name: tara/openai/gpt-oss-20b
spec:
  cluster_name: tara
  model_name: openai/gpt-oss-20b
  router_params:
    max_backend_concurrency: 20
  prometheus_metrics_path:  "/metrics"
  prometheus_scrape_interval_sec: 15

  min_replicas: 0
  max_replicas: 2
  scaling_strategy:
    immediate_cold_start: true
    scale_down_sustain_sec: 10800
    scaling_thresholds:
      - [0.0, 1]
      - [5.0, 2]

  max_consecutive_launch_failures: 2
  launch_spec:
    served_model_name: openai/gpt-oss-20b
    gpus_per_node: 1
    num_nodes: 1
    venv_path: /vast/draco/tara/projects/Tara_Deployment/inference_service/envs/vllm0.26
    weights_path: /vast/draco/tara/projects/Tara_Deployment/msalim/.cache/huggingface/hub/models--openai--gpt-oss-20b/snapshots/6cee5e81ee83917806bbde320786a8fb61efebee
    weights_cache_path: ""
    max_startup_sec: 600
    health_check:
      url: /health

    env:
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      HTTP_PROXY: "http://proxy.alcf.anl.gov:3128"
      HTTPS_PROXY: "http://proxy.alcf.anl.gov:3128"
      TIKTOKEN_ENCODINGS_BASE: /vast/draco/tara/projects/Tara_Deployment/inference_service/weights/tiktoken_encodings

    serve_script_template: |
      source {{venv_path}}/bin/activate
      which python

      # Need to point at regular gcc 14:
      module load gcc-native
      export CC=$(command -v gcc)
      export CXX=$(command -v g++)

      export CUDA_VISIBLE_DEVICES={{ gpus_by_host.values() | first | join(',') }}
      vllm serve {{weights_path}} \
        --served-model-name {{served_model_name}} \
        --uds {{uds}} \
        --disable-access-log-for-endpoints /health,/metrics \
        --enable-log-requests \
        --tensor-parallel-size 1 \
        --max-model-len 65536 \
        --max-num-seqs 32 \
        --tool-call-parser openai \
        --enable-auto-tool-choice
