services:
  postgres:
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U first_gateway -d first_gateway_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env.default # common
        required: true
      - path: ../.env.compose # specific to compose stack
        required: true
      - path: ../.env.secret  # .gitignored secrets
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: .venv/bin/alembic -c packages/gateway/first_gateway/database/alembic.ini upgrade head
    networks:
      - gateway

  redis:
    volumes:
      - redis-dev:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../pki:/etc/prometheus/certs
    ports:
      - "9090:9090"
    networks:
      - gateway
    depends_on:
      tunnel:
        condition: service_healthy
    environment:
      - ALL_PROXY=socks5h://tunnel:1080
      - HTTPS_PROXY=socks5h://tunnel:1080
      - HTTP_PROXY=socks5h://tunnel:1080
      - NO_PROXY=localhost,127.0.0.1,controller-manager,inference-gateway

  controller-manager:
    depends_on:
      tunnel:
        condition: service_healthy
    environment:
      - ALL_PROXY=socks5h://tunnel:1080

  inference-gateway:
    depends_on:
      tunnel:
        condition: service_healthy
    environment:
      - ALL_PROXY=socks5h://tunnel:1080

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    networks:
      - gateway

  tunnel:
  # docker compose up -d, then docker compose attach tunnel to get the OTP
  # prompt, type the token, then detach with Ctrl-p Ctrl-q (leaves it running).
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tunnel
    command:
      - ssh
      - -N
      - -D
      - 0.0.0.0:1080
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - StrictHostKeyChecking=accept-new
      - msalim@bastion.alcf.anl.gov
    stdin_open: true # so you can type the OTP
    tty: true
    restart: "no"       # important: auto-restart would hang waiting for OTP
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1080"]
      interval: 5s
      retries: 60
    networks:
      - gateway

volumes:
  grafana-storage:
  postgres-dev:
  redis-dev: